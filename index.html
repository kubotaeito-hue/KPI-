<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KPI管理＋久保田式預け金</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#111;}
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;
  --border:#e0e0e0;--border2:#ccc;
  --text:#111;--text2:#666;--text3:#999;
  --r:12px;--rm:8px;
  --c-blue:#2563EB;--c-green:#16A34A;--c-red:#DC2626;--c-gold:#B45309;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--border:#333;--border2:#444;--text:#f0f0f0;--text2:#aaa;--text3:#666;}
}
.app{width:100%;max-width:430px;margin:0 auto;padding:0 0 4rem;font-size:14px;background:var(--bg);min-height:100vh;}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:1rem;position:sticky;top:0;background:var(--bg);z-index:10;}
.tab{flex:1;padding:8px 2px;font-size:11px;font-weight:500;text-align:center;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab.active{color:var(--c-blue);border-bottom-color:var(--c-blue);}
.section{display:none;padding:0 12px;}
.section.active{display:block;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.nav-btn{background:none;border:0.5px solid var(--border);border-radius:var(--rm);padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;}
.wl{font-size:13px;font-weight:500;color:var(--text);}
.kpi-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.kpi-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.kpi-title{font-size:13px;font-weight:500;color:var(--text);}
.kpi-badge{font-size:11px;color:var(--text2);margin-left:auto;}
.kpi-table{width:100%;border-collapse:separate;border-spacing:0 2px;}
.th-day{font-size:11px;color:var(--text2);text-align:center;padding-bottom:6px;}
.th-label{width:44px;}
.th-total{width:34px;font-size:11px;color:var(--text2);text-align:center;padding-bottom:6px;}
.cell-label{font-size:11px;font-weight:500;color:var(--text2);padding-right:4px!important;white-space:nowrap;vertical-align:middle;}
.cell-goal{background:var(--bg2);text-align:center;font-size:12px;color:var(--text2);border-radius:4px;padding:5px 2px!important;vertical-align:middle;}
.cell-goal-total{background:var(--bg2);text-align:center;font-size:12px;font-weight:600;color:var(--text2);border-radius:4px;padding:5px 2px!important;vertical-align:middle;}
.cell-actual{text-align:center;vertical-align:middle;padding:2px!important;}
.cell-actual-total{text-align:center;font-size:14px;font-weight:700;padding:4px 2px!important;vertical-align:middle;}
.cell-diff{text-align:center;font-size:12px;font-weight:500;border-radius:4px;padding:5px 2px!important;vertical-align:middle;}
.diff-pos{background:#E1F5EE;color:#0F6E56;}
.diff-neg{background:#FAECE7;color:#D85A30;}
.diff-zero{color:var(--text2);}
.cell-diff-total{text-align:center;font-size:12px;font-weight:700;border-radius:4px;padding:5px 2px!important;vertical-align:middle;}
.tap-cell{display:flex;flex-direction:column;align-items:center;gap:2px;}
.tap-display{font-size:15px;font-weight:700;color:var(--text);min-width:28px;text-align:center;line-height:1;padding:2px 0;}
.tap-display.pop{animation:pop .18s ease;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.btn-plus{width:36px;height:36px;border-radius:50%;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .1s,opacity .1s;-webkit-tap-highlight-color:transparent;user-select:none;}
.btn-plus:active{transform:scale(.88);opacity:.85;}
.btn-minus{width:24px;height:24px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:transform .1s;-webkit-tap-highlight-color:transparent;user-select:none;}
.btn-minus:active{transform:scale(.88);}
.chart-wrap{position:relative;width:100%;height:180px;margin-top:14px;}
.chart-legend{display:flex;gap:14px;margin-top:6px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-line{width:18px;height:2px;border-radius:1px;}
.legend-line.dashed{background:repeating-linear-gradient(90deg,#aaa 0,#aaa 4px,transparent 4px,transparent 8px);}
.summary-row{display:flex;gap:8px;margin-bottom:12px;}
.stat-card{flex:1;background:var(--bg2);border-radius:var(--rm);padding:10px;}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
.stat-val{font-size:18px;font-weight:500;}
.sec-title{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.note-area{width:100%;border:0.5px solid var(--border);border-radius:var(--rm);padding:10px;font-size:13px;min-height:80px;background:var(--bg);color:var(--text);resize:none;}
.save-btn{width:100%;padding:10px;background:var(--c-blue);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
.save-btn:active{opacity:.85;}
.goal-input{width:100%;border:0.5px solid var(--border);border-radius:6px;padding:6px 2px;text-align:center;font-size:13px;font-weight:600;background:var(--bg);color:var(--text);-moz-appearance:textfield;}
.goal-input::-webkit-inner-spin-button,.goal-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.goal-input:focus{outline:none;border-color:var(--c-blue);}
.kpi-name-input{width:100%;border:0.5px solid var(--border);border-radius:var(--rm);padding:7px 10px;font-size:13px;background:var(--bg);color:var(--text);}
.color-pick{display:flex;gap:8px;}
.color-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-opt.selected{border-color:var(--text);}
.s-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.s-row label{font-size:12px;color:var(--text2);width:36px;flex-shrink:0;}
.pct-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.pct-label{font-size:12px;color:var(--text2);width:40px;flex-shrink:0;}
.pct-bar-wrap{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;}
.pct-bar{height:100%;border-radius:4px;transition:width .4s ease,background .4s ease;}
.pct-val{font-size:13px;font-weight:500;width:38px;text-align:right;flex-shrink:0;}
.judge-inline{border-radius:var(--rm);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid;margin-top:8px;-webkit-tap-highlight-color:transparent;transition:opacity .1s;}
.judge-inline:active{opacity:.8;}
.judge-inline-achieve{background:#F0FDF4;border-color:#86EFAC;}
.judge-inline-fail{background:#FEF2F2;border-color:#FCA5A5;}
.judge-done-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border-radius:10px;background:var(--bg2);color:var(--text2);margin-top:8px;}
.banner-row{display:flex;gap:8px;margin-bottom:10px;}
.ach-banner{flex:1;display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--rm);cursor:pointer;border:0.5px solid;transition:opacity .1s;-webkit-tap-highlight-color:transparent;}
.ach-banner:active{opacity:.75;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:all;}
.sheet{width:100%;max-width:430px;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 36px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto;}
.overlay.show .sheet{transform:translateY(0);}
.sh-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.sh-emoji{font-size:36px;text-align:center;margin-bottom:8px;}
.sh-title{font-size:17px;font-weight:500;color:var(--text);text-align:center;margin-bottom:5px;}
.sh-sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:20px;line-height:1.6;}
.reward-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.reward-card{border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;}
.reward-card.selected{border:1.5px solid #16A34A;background:#F0FDF4;}
.rc-num{font-size:11px;color:var(--text2);width:18px;flex-shrink:0;}
.rc-text{font-size:14px;color:var(--text);line-height:1.5;}
.penalty-box{border:1.5px solid #DC2626;border-radius:var(--r);padding:18px;margin-bottom:18px;background:#FEF2F2;text-align:center;}
.pb-label{font-size:10px;font-weight:500;color:#DC2626;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.pb-text{font-size:15px;font-weight:500;color:#7F1D1D;line-height:1.6;}
.modal-btn{width:100%;padding:13px;border:none;border-radius:var(--rm);font-size:15px;font-weight:500;color:#fff;cursor:pointer;}
.modal-btn:active{opacity:.85;}
.modal-sub{width:100%;padding:10px;border:none;background:none;font-size:13px;color:var(--text2);cursor:pointer;margin-top:6px;}
.usage-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.usage-opt{border:0.5px solid var(--border);border-radius:var(--rm);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;}
.usage-opt.selected{border:1.5px solid var(--c-blue);background:#EFF6FF;}
.uoi{font-size:20px;flex-shrink:0;}
.uot{font-size:13px;color:var(--text);line-height:1.4;}
.dep-hero{border-radius:var(--r);padding:16px;margin-bottom:12px;border:0.5px solid #F59E0B;background:#FFFBEB;}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.d-stat{background:var(--bg);border-radius:var(--rm);padding:10px 12px;}
.d-sl{font-size:10px;color:var(--text2);margin-bottom:3px;}
.d-sv{font-size:18px;font-weight:500;}
.p-card{border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.p-label{font-size:13px;font-weight:500;color:var(--text);}
.sk-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:10px;margin-bottom:8px;}
.sk-ok{background:#DCFCE7;color:#16A34A;}
.sk-w{background:#FEF3C7;color:#92400E;}
.sk-d{background:#FEE2E2;color:#DC2626;}
.j-row{display:flex;gap:8px;margin-top:8px;}
.j-btn{flex:1;padding:10px 6px;border-radius:var(--rm);font-size:12px;font-weight:500;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;transition:opacity .1s;}
.j-btn:active{opacity:.8;}
.j-ach{background:#DCFCE7;color:#16A34A;}
.j-fail{background:#FEE2E2;color:#DC2626;}
.j-ex{background:var(--bg2);color:var(--text2);}
.h-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);}
.h-item:last-child{border-bottom:none;}
.hbadge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.ba{background:#DCFCE7;color:#16A34A;}
.bf{background:#FEE2E2;color:#DC2626;}
.be{background:#F3F4F6;color:#6B7280;}
.rule-item{display:flex;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:12px;line-height:1.5;color:var(--text);}
.rule-item:last-child{border-bottom:none;}
.rn{color:var(--text2);flex-shrink:0;width:20px;}
.cap-warn{background:#FEF3C7;border:0.5px solid #F59E0B;border-radius:var(--rm);padding:8px 12px;font-size:12px;color:#92400E;margin-bottom:10px;}
</style>
</head>
<body>
<div class="app">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">KPI管理＋久保田式預け金</h1>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('weekly')">📅<br>週次</button>
    <button class="tab" onclick="showTab('monthly')">📊<br>月次</button>
    <button class="tab" onclick="showTab('yearly')">📈<br>年間</button>
    <button class="tab" onclick="showTab('deposit')">💰<br>預け金</button>
    <button class="tab" onclick="showTab('settings')">⚙️<br>設定</button>
  </div>
  <div id="tab-weekly" class="section active">
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">‹ 前週</button>
      <span class="wl" id="week-label"></span>
      <button class="nav-btn" onclick="changeWeek(1)">次週 ›</button>
    </div>
    <div id="kpi-cards"></div>
  </div>
  <div id="tab-monthly" class="section">
    <div class="week-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹ 前月</button>
      <span class="wl" id="month-label"></span>
      <button class="nav-btn" onclick="changeMonth(1)">翌月 ›</button>
    </div>
    <div id="monthly-summary"></div>
    <div class="card" style="margin-top:4px;">
      <div class="sec-title">月次メモ</div>
      <textarea class="note-area" id="month-note" placeholder="今月の振り返り・気づき..."></textarea>
      <button class="save-btn" onclick="saveNote()">保存</button>
    </div>
  </div>
  <div id="tab-yearly" class="section">
    <div class="week-nav">
      <button class="nav-btn" onclick="changeYear(-1)">‹ 前年</button>
      <span class="wl" id="year-label"></span>
      <button class="nav-btn" onclick="changeYear(1)">翌年 ›</button>
    </div>
    <div id="yearly-content"></div>
  </div>
  <div id="tab-deposit" class="section"><div id="deposit-content"></div></div>
  <div id="tab-settings" class="section"><div id="settings-content"></div></div>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-emoji" id="sh-emoji"></div>
    <div class="sh-title" id="sh-title"></div>
    <div class="sh-sub" id="sh-sub"></div>
    <div id="sh-body"></div>
    <button class="modal-btn" id="sh-btn"></button>
    <button class="modal-sub" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

function mkKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function wkToday(){ return getWeekKey(new Date()); }

function getWeekKey(d) {
  const day = d.getDay(), diff = d.getDate() - day + (day===0 ? -6 : 1);
  const m = new Date(d); m.setDate(diff); return m.toISOString().slice(0,10);
}
function fmtWk(k) {
  const m = new Date(k), f = new Date(k); f.setDate(f.getDate()+4);
  const s = d => (d.getMonth()+1)+'/'+d.getDate(); return s(m)+'〜'+s(f);
}

function getData(wk,ki,di) { return ST.data[wk]?.[ki]?.[di] ?? 0; }
function setData(wk,ki,di,val) {
  if (!ST.data[wk]) ST.data[wk] = {};
  if (!ST.data[wk][ki]) ST.data[wk][ki] = {};
  ST.data[wk][ki][di] = Math.max(0, Number(val));
  sv(); updateRow(ki, wk);
  const el = document.getElementById('disp-'+ki+'-'+di);
  if (el) { el.textContent = ST.data[wk][ki][di]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  if (wk === wkToday()) updateJudgeBanners();
}
function tap(ki,di,d) { setData(curWk, ki, di, getData(curWk,ki,di)+d); }
function wgt(ki) { return ST.kpis[ki].goals.reduce((s,g) => s+g, 0); }

function calcDayPct(wk,di) {
  let a=0,g=0; ST.kpis.forEach((kpi,ki) => { a+=getData(wk,ki,di); g+=kpi.goals[di]; }); return g>0 ? Math.round(a/g*100) : 0;
}
function calcWeekPct(wk) {
  let a=0,g=0; ST.kpis.forEach((kpi,ki) => { for(let d=0;d<5;d++){a+=getData(wk,ki,d);g+=kpi.goals[d];} }); return g>0 ? Math.round(a/g*100) : 0;
}
function calcMonthPct(y,m) {
  const wks=getMonthWeeks(y,m); let a=0,g=0;
  ST.kpis.forEach((kpi,ki) => { wks.forEach(wk => { for(let d=0;d<5;d++){a+=getData(wk,ki,d);g+=kpi.goals[d];} }); });
  return g>0 ? Math.round(a/g*100) : 0;
}

function calcDepAmt(period) {
  const base=DB[period], streak=ST.deposit.streaks[period]||0;
  if (streak>=3) return Math.round(base*2);
  if (streak>=2) return Math.round(base*1.5);
  return base;
}
function getRemCap() { return Math.max(0, MFC - (ST.deposit.monthlyForfeit[mkKey()]||0)); }

    document.getElementById('sh-sub').textContent   = fmt(amount) + 'を自分の報酬に使えます！';

    btn.style.background = '#D97706'; btn.textContent = '✅ これに使う！';

function confirmDep() {
  const {period,result,amount,actualForfeit,judgedKey} = dCtx;
  const mk = mkKey();
  if (judgedKey) ST.deposit.judged[judgedKey] = true;
  if (result === 'achieve') {
    ST.deposit.streaks[period] = 0;
    const use = AU[modalSel] || AU[0];
    ST.deposit.history.unshift({period,result:'achieve',amount,use,date:toStr(),note:use});
  } else if (result === 'fail') {
    ST.deposit.streaks[period] = (ST.deposit.streaks[period]||0) + 1;
    const forfeit = actualForfeit || amount;
    if (!ST.deposit.monthlyForfeit[mk]) ST.deposit.monthlyForfeit[mk] = 0;
    ST.deposit.monthlyForfeit[mk] += forfeit;
    const use = FU[modalSel] || FU[0];
    ST.deposit.history.unshift({period,result:'fail',amount:forfeit,use,date:toStr(),note:use});
  } else {
    ST.deposit.history.unshift({period,result:'exception',amount:0,use:'例外',date:toStr(),note:'例外適用'});
  }
  if (ST.deposit.history.length > 60) ST.deposit.history.pop();
  sv(); closeModal(); updateJudgeBanners();
  if (document.getElementById('tab-deposit').classList.contains('active')) renderDeposit();
}

    DAYS.forEach((_,di) => {
      const v=getData(curWk,ki,di)-kpi.goals[di], c=v>0?'diff-pos':v<0?'diff-neg':'diff-zero';
      tableRows += '<td class="cell-diff ' + c + '" id="diff-' + ki + '-' + di + '">' + (v>0?'+'+v:v) + '</td>';
    });
    tableRows += '<td class="cell-diff-total ' + dc + '" id="tdiff-' + ki + '">' + (wd>0?'+'+wd:wd) + '</td></tr>';

    card.innerHTML =
      '<div class="kpi-header">' +
        '<span class="kpi-dot" style="background:' + color + '"></span>' +
        '<span class="kpi-title">' + kpi.name + '</span>' +
        '<span class="kpi-badge">週目標 ' + w + '件</span>' +
      '</div>' +
      '<table class="kpi-table">' +
        '<thead><tr><th class="th-label"></th>' + DAYS.map(d=>'<th class="th-day">'+d+'</th>').join('') + '<th class="th-total">計</th></tr></thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table>' +
      '<div class="chart-wrap"><canvas id="chart-' + ki + '" role="img" aria-label="' + kpi.name + 'の累計推移"></canvas></div>' +
      '<div class="chart-legend">' +
        '<span class="legend-item"><span class="legend-line dashed"></span>目標累計</span>' +
        '<span class="legend-item"><span class="legend-line" style="background:' + color + '"></span>実績累計</span>' +
      '</div>';
    container.appendChild(card);
    setTimeout(() => drawWC(ki, color), 0);
  });
}

function buildCum(ki, wk) {
  const kpi=ST.kpis[ki], cg=[], ca=[]; let g=0,a=0;
  for(let i=0;i<5;i++){ g+=kpi.goals[i]; a+=getData(wk,ki,i); cg.push(g); ca.push(a); }
  return {cg, ca};
}
function drawWC(ki, color) {
  const c=document.getElementById('chart-'+ki); if(!c) return;
  if(charts['w'+ki]) charts['w'+ki].destroy();
  const {cg,ca} = buildCum(ki, curWk);
  charts['w'+ki] = new Chart(c, {
    type:'line',
    data:{labels:DAYS, datasets:[
      {label:'目標',data:cg,borderColor:'#BBBBBB',borderWidth:2,borderDash:[6,4],pointRadius:4,pointBackgroundColor:'#fff',pointBorderColor:'#BBBBBB',pointBorderWidth:2,tension:0,fill:false},
      {label:'実績',data:ca,borderColor:color,borderWidth:2.5,pointRadius:5,pointBackgroundColor:color,pointBorderColor:'#fff',pointBorderWidth:2,tension:0,fill:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+'累計: '+ctx.parsed.y+'件'}}},
      scales:{y:{beginAtZero:true,grid:{color:'rgba(128,128,128,.12)'},ticks:{font:{size:11},color:'#999',maxTicksLimit:5}},x:{grid:{display:false},ticks:{font:{size:11},color:'#999'}}}}
  });
}
function updWC(ki, wk) {
  if(!charts['w'+ki]) return;
  const {cg,ca} = buildCum(ki, wk);
  charts['w'+ki].data.datasets[0].data = cg; charts['w'+ki].data.datasets[1].data = ca; charts['w'+ki].update('none');
}

function getMonthWeeks(y, m) {
  const w=[], d=new Date(y,m,1);
  while(d.getMonth()===m){ const k=getWeekKey(d); if(!w.includes(k)) w.push(k); d.setDate(d.getDate()+7); }
  return w;
}

function renderMonthly() {
  document.getElementById('month-label').textContent = vYear+'年 '+ML[vMonth];
  const container=document.getElementById('monthly-summary'); container.innerHTML='';
  const banDiv=document.createElement('div'); banDiv.innerHTML=bannerHTML('month'); container.appendChild(banDiv);
  const weeks=getMonthWeeks(vYear,vMonth);
  ST.kpis.forEach((kpi,ki) => {
    const color=KC[kpi.color];
    const wd=weeks.map(wk=>{ let a=0; for(let d=0;d<5;d++) a+=getData(wk,ki,d); return {a,g:wgt(ki)}; });
    const ta=wd.reduce((s,w)=>s+w.a,0), tg=wgt(ki)*weeks.length, pct=tg>0?Math.round(ta/tg*100):0, diff=ta-tg;
    const pc=pct>=80?'#16A34A':'#DC2626';
    const card=document.createElement('div'); card.className='card';
    card.innerHTML =
      '<div class="kpi-header">' +
        '<span class="kpi-dot" style="background:'+color+'"></span>' +
        '<span class="kpi-title">'+kpi.name+'</span>' +
        '<span style="margin-left:auto;font-size:12px;font-weight:500;color:'+pc+';">'+pct+'% '+(pct>=80?'✓':'✗')+'</span>' +
      '</div>' +
      '<div class="summary-row">' +
        '<div class="stat-card"><div class="stat-label">実績</div><div class="stat-val" style="color:'+color+'">'+ta+'</div></div>' +
        '<div class="stat-card"><div class="stat-label">目標</div><div class="stat-val">'+tg+'</div></div>' +
        '<div class="stat-card"><div class="stat-label">達成率</div><div class="stat-val" style="color:'+pc+'">'+pct+'%</div></div>' +
      '</div>' +
      '<div class="chart-wrap" style="height:160px;"><canvas id="mchart-'+ki+'" role="img"></canvas></div>' +
      '<div class="chart-legend">' +
        '<span class="legend-item"><span class="legend-line dashed"></span>目標累計</span>' +
        '<span class="legend-item"><span class="legend-line" style="background:'+color+'"></span>実績累計</span>' +
      '</div>';
    container.appendChild(card);
    setTimeout(() => {
      const c=document.getElementById('mchart-'+ki); if(!c) return;
      if(charts['m'+ki]) charts['m'+ki].destroy();
      let cg=0,ca=0; const cumG=[],cumA=[]; wd.forEach(w=>{ cg+=w.g; ca+=w.a; cumG.push(cg); cumA.push(ca); });
      charts['m'+ki] = new Chart(c, {
        type:'line', data:{labels:weeks.map((_,i)=>'第'+(i+1)+'週'), datasets:[
          {label:'目標',data:cumG,borderColor:'#BBBBBB',borderWidth:2,borderDash:[6,4],pointRadius:4,pointBackgroundColor:'#fff',pointBorderColor:'#BBBBBB',pointBorderWidth:2,tension:0,fill:false},
          {label:'実績',data:cumA,borderColor:color,borderWidth:2.5,pointRadius:5,pointBackgroundColor:color,pointBorderColor:'#fff',pointBorderWidth:2,tension:0,fill:false}
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true,grid:{color:'rgba(128,128,128,.12)'},ticks:{font:{size:10},color:'#999',maxTicksLimit:5}},x:{grid:{display:false},ticks:{font:{size:11},color:'#999'}}}}
      });
    }, 0);
  });
  const nk=vYear+'-'+String(vMonth+1).padStart(2,'0');
  document.getElementById('month-note').value=ST.notes[nk]||''; document.getElementById('month-note').dataset.key=nk;
}
function saveNote() {
  const k=document.getElementById('month-note').dataset.key;
  ST.notes[k]=document.getElementById('month-note').value; sv();
  const btn=document.querySelector('.save-btn'); btn.textContent='✓ 保存しました'; setTimeout(()=>btn.textContent='保存',1500);
}

function renderYearly() {
  document.getElementById('year-label').textContent = vYear+'年';
  const container=document.getElementById('yearly-content'); container.innerHTML='';
  ST.kpis.forEach((kpi,ki) => {
    const color=KC[kpi.color];
    const md=Array.from({length:12},(_,mi)=>{
      const w=getMonthWeeks(vYear,mi); let a=0,g=0;
      w.forEach(wk=>{ for(let d=0;d<5;d++) a+=getData(wk,ki,d); g+=wgt(ki); }); return {a,g};
    });
    const ta=md.reduce((s,m)=>s+m.a,0), tg=md.reduce((s,m)=>s+m.g,0), pct=tg>0?Math.round(ta/tg*100):0;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML =
      '<div class="kpi-header">' +
        '<span class="kpi-dot" style="background:'+color+'"></span>' +
        '<span class="kpi-title">'+kpi.name+'</span>' +
        '<span class="kpi-badge" style="color:'+color+';font-weight:500">'+pct+'% ('+ta+'/'+tg+'件)</span>' +
      '</div>' +
      '<div class="chart-wrap" style="height:180px;"><canvas id="ychart-'+ki+'" role="img"></canvas></div>' +
      '<div class="chart-legend">' +
        '<span class="legend-item"><span class="legend-line dashed"></span>目標累計</span>' +
        '<span class="legend-item"><span class="legend-line" style="background:'+color+'"></span>実績累計</span>' +
      '</div>';
    container.appendChild(card);
    setTimeout(() => {
      const c=document.getElementById('ychart-'+ki); if(!c) return;
      if(charts['y'+ki]) charts['y'+ki].destroy();
      let cg=0,ca=0; const cumG=[],cumA=[]; md.forEach(m=>{ cg+=m.g; ca+=m.a; cumG.push(cg); cumA.push(ca); });
      charts['y'+ki] = new Chart(c, {
        type:'line', data:{labels:ML.map(m=>m.replace('月','')), datasets:[
          {label:'目標',data:cumG,borderColor:'#BBBBBB',borderWidth:2,borderDash:[6,4],pointRadius:3,pointBackgroundColor:'#fff',pointBorderColor:'#BBBBBB',pointBorderWidth:2,tension:0,fill:false},
          {label:'実績',data:cumA,borderColor:color,borderWidth:2.5,pointRadius:4,pointBackgroundColor:color,pointBorderColor:'#fff',pointBorderWidth:2,tension:0,fill:false}
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{y:{beginAtZero:true,grid:{color:'rgba(128,128,128,.12)'},ticks:{font:{size:10},color:'#999',maxTicksLimit:5}},x:{grid:{display:false},ticks:{font:{size:9},color:'#999'}}}}
      });
    }, 0);
  });
}

function renderDeposit() {
  const h=ST.deposit.history;
  const tA=h.filter(x=>x.result==='achieve').reduce((s,x)=>s+x.amount,0);
  const tF=h.filter(x=>x.result==='fail').reduce((s,x)=>s+x.amount,0);
  const mk=mkKey(), tmf=ST.deposit.monthlyForfeit[mk]||0, rem=getRemCap();
  const RULES = [
    '毎朝500円・毎週月曜3,500円・毎月1日25,000円を封筒へ',
    '達成基準は全KPI平均80%以上。79%以下は問答無用で未達',
    '達成した預け金は自分の報酬予算として使える',
    '未達の預け金は24時間以内に募金する',
    '惜しかった・忙しかった・疲れていた、は未達扱い',
    '例外は体調不良・仕事/家族の緊急対応・災害事故のみ',
    '月間の没収上限は' + fmt(MFC),
    '2回連続未達で×1.5倍、3回以上で×2倍'
  ];
  let html =
    '<div class="dep-hero">' +
      '<div style="font-size:11px;font-weight:500;color:#92400E;letter-spacing:.05em;margin-bottom:10px;">💰 久保田式・預け金制度</div>' +
      '<div class="d-grid">' +
        '<div class="d-stat"><div class="d-sl">達成で獲得（累計）</div><div class="d-sv" style="color:#16A34A;">' + fmt(tA) + '</div></div>' +
        '<div class="d-stat"><div class="d-sl">未達で没収（累計）</div><div class="d-sv" style="color:#DC2626;">' + fmt(tF) + '</div></div>' +
        '<div class="d-stat"><div class="d-sl">今月の没収額</div><div class="d-sv" style="color:' + (tmf>=MFC?'#DC2626':'#B45309') + ';">' + fmt(tmf) + '</div></div>' +
        '<div class="d-stat"><div class="d-sl">今月の没収残枠</div><div class="d-sv" style="color:#0F6E56;">' + fmt(rem) + '</div></div>' +
      '</div>' +
    '</div>';

  ['day','week','month'].forEach(period => {
    const base=DB[period], streak=ST.deposit.streaks[period]||0, cur=calcDepAmt(period), pl=DL[period];
    const timing = {day:'毎日就寝前', week:'日曜夜', month:'月末夜'}[period];
    let sk = '';
    if      (streak===0) sk = '<span class="sk-badge sk-ok">連続未達なし（基本額）</span>';
    else if (streak===1) sk = '<span class="sk-badge sk-w">1回連続未達（次回×1.5倍）</span>';
    else if (streak===2) sk = '<span class="sk-badge sk-w">2回連続未達 → 現在×1.5倍</span>';
    else                 sk = '<span class="sk-badge sk-d">' + streak + '回連続未達 → 現在×2倍</span>';
    const ac = cur>base ? '#DC2626' : '#B45309';
    html +=
      '<div class="p-card">' +
        '<div class="p-head">' +
          '<span class="p-label">' + pl + '預け金</span>' +
          '<span style="font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:#FEF3C7;color:' + ac + ';">' + fmt(cur) + (cur>base?' (基本'+fmt(base)+')':'') + '</span>' +
        '</div>' +
        sk +
        '<div style="font-size:11px;color:var(--text2);margin-bottom:8px;">判定タイミング：' + timing + '　達成基準：全KPI平均80%以上</div>' +
        '<div class="j-row">' +
          '<button class="j-btn j-ach" onclick="openDepJudge(\'' + period + '\',\'achieve\',null)">🎉 達成（手動）</button>' +
          '<button class="j-btn j-fail" onclick="openDepJudge(\'' + period + '\',\'fail\',null)">😢 未達（手動）</button>' +
        '</div>' +
        '<div class="j-row">' +
          '<button class="j-btn j-ex" style="font-size:11px;" onclick="openDepJudge(\'' + period + '\',\'exception\',null)">🙏 例外適用（体調不良・緊急・災害のみ）</button>' +
        '</div>' +
      '</div>';
  });

  html +=
    '<div class="card" style="margin-top:4px;">' +
      '<div class="sec-title">久保田式ルール</div>' +
      RULES.map((r,i) => '<div class="rule-item"><span class="rn">'+(i+1)+'</span><span>'+r+'</span></div>').join('') +
    '</div>';

  html += '<div class="sec-title" style="margin-top:4px;">判定履歴</div>';
  if (h.length === 0) {
    html += '<div style="text-align:center;padding:20px 0;font-size:13px;color:var(--text2);">まだ記録がありません</div>';
  } else {
    html += h.slice(0,30).map(x => {
      const bc = x.result==='achieve'?'ba':x.result==='fail'?'bf':'be';
      const bl = x.result==='achieve'?'達成':x.result==='fail'?'未達':'例外';
      const ac = x.result==='achieve'?'#16A34A':x.result==='fail'?'#DC2626':'var(--text2)';
      const as = x.result==='exception'?'−':x.result==='achieve'?'+'+fmt(x.amount):'-'+fmt(x.amount);
      return (
        '<div class="h-item">' +
          '<span class="hbadge '+bc+'">'+bl+'</span>' +
          '<div style="flex:1;">' +
            '<div style="font-size:13px;color:var(--text);">'+DL[x.period]+'・'+x.note+'</div>' +
            '<div style="font-size:11px;color:var(--text2);margin-top:2px;">'+x.date+'</div>' +
          '</div>' +
          '<span style="font-size:14px;font-weight:500;color:'+ac+';">'+as+'</span>' +
        '</div>'
      );
    }).join('');
  }
  document.getElementById('deposit-content').innerHTML = html;
}

function renderSettings() {
  document.getElementById('settings-content').innerHTML = ST.kpis.map((kpi,ki) => {
    const color = KC[kpi.color];
    let goalCells = '';
    DAYS.forEach((_,di) => {
      goalCells +=
        '<td style="padding:2px 3px;">' +
          '<input type="number" class="goal-input" min="0" value="' + kpi.goals[di] + '" ' +
            'style="border-top:2.5px solid ' + color + ';" ' +
            'onchange="ST.kpis[' + ki + '].goals[' + di + ']=Math.max(0,Number(this.value));sv();updWS(' + ki + ')">' +
        '</td>';
    });
    return (
      '<div class="card" style="margin-bottom:12px;">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
          '<span class="kpi-dot" style="background:' + color + '"></span>' +
          '<span style="font-size:13px;font-weight:500;color:var(--text);">KPI ' + (ki+1) + '</span>' +
        '</div>' +
        '<div class="s-row" style="margin-bottom:12px;">' +
          '<label>名前</label>' +
          '<input type="text" class="kpi-name-input" value="' + kpi.name + '" onchange="ST.kpis[' + ki + '].name=this.value;sv()">' +
        '</div>' +
        '<div class="s-row" style="margin-bottom:12px;">' +
          '<label>色</label>' +
          '<div class="color-pick">' +
            KC.map((c,ci) =>
              '<div class="color-opt ' + (kpi.color===ci?'selected':'') + '" style="background:' + c + '" ' +
                'onclick="ST.kpis[' + ki + '].color=' + ci + ';sv();renderSettings()"></div>'
            ).join('') +
          '</div>' +
        '</div>' +
        '<div class="sec-title" style="margin-bottom:6px;">曜日別の目標件数</div>' +
        '<table style="width:100%;border-collapse:separate;border-spacing:0 4px;">' +
          '<thead><tr>' +
            DAYS.map(d => '<th style="text-align:center;font-size:12px;color:var(--text2);padding-bottom:6px;">' + d + '</th>').join('') +
            '<th style="text-align:center;font-size:11px;color:var(--text2);padding-bottom:6px;">週計</th>' +
          '</tr></thead>' +
          '<tbody><tr>' +
            goalCells +
            '<td style="text-align:center;font-size:13px;font-weight:500;color:' + color + ';padding:2px 3px;" id="wsum-' + ki + '">' + wgt(ki) + '</td>' +
          '</tr></tbody>' +
        '</table>' +
      '</div>'
    );
  }).join('');
}
function updWS(ki) { const el=document.getElementById('wsum-'+ki); if(el) el.textContent=wgt(ki); }

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['weekly','monthly','yearly','deposit','settings'][i]===name));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='weekly')   renderWeekly();
  if (name==='monthly')  renderMonthly();
  if (name==='yearly')   renderYearly();
  if (name==='deposit')  renderDeposit();
  if (name==='settings') renderSettings();
}

renderWeekly();
</script>
</body>
</html>
